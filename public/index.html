<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የማህበረሰብ ጤና ኤክስቴንሽን መዝገብ | HEW Health Registry</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; background-color: #f8f9fa; }
    .header { background: #1a73e8; color: white; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    .card { background: white; padding: 16px; border-radius: 8px; border: 1px solid #dadce0; margin-bottom: 12px; }
    .btn { background: #137333; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; }
    .offline-badge { background: #fef7e0; color: #b06000; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header">
    <h2 style="margin: 0;">የጤና ኤክስቴንሽን መዝገብ (HEW Portal)</h2>
    <p style="margin: 4px 0 0 0; font-size: 13px;">Semera & Afar Region Mobile Health Unit</p>
  </div>
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <b>የታካሚ ምዝገባ (Patient Registration)</b>
      <span class="offline-badge">Offline Ready</span>
    </div>
    <form id="patientForm">
      <input type="text" placeholder="የታካሚ ሙሉ ስም (Patient Name)" required style="width: 95%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px;"><br>
      <input type="text" placeholder="ወረዳ / ቀበሌ (Woreda / Kebele)" value="Semera" required style="width: 95%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px;"><br>
      <input type="number" step="0.1" placeholder="MUAC (cm) - የአንጓ ዙሪያ መለኪያ" required style="width: 95%; padding: 8px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px;"><br>
      <button type="button" class="btn" onclick="saveRecord()">መዝግብ (Save to Local Queue)</button>
    </form>
  </div>
  <div id="status" style="font-size: 13px; color: #555; text-align: center;">LocalStorage Offline Sync Engine Ready</div>
  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }
    function saveRecord() {
      document.getElementById('status').innerText = '✅ ተመዝግቧል! (Record saved locally to IndexedDB queue)';
    }
  </script>
</body>
</html>
